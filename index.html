<meta charset="utf-8">
<title>두근두근 퍼즐랜드</title>
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<style>
  :root{
    --sky1:#fef2e0; --sky2:#e6f0ff; --card:#fffdfa;
    --ink:#6b4a6e; --accent:#ff7bac; --accent2:#8ec9ff;
    --good:#63c97a; --line:#f3c6da;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0; font-family:"Comic Sans MS","Segoe UI",'Malgun Gothic',sans-serif;
    background:linear-gradient(180deg,var(--sky1) 0%,var(--sky2) 100%);
    color:var(--ink); overflow-x:hidden;
    display:flex; flex-direction:column; align-items:center;
    min-height:100vh; user-select:none;
  }
  .float{position:fixed; font-size:2rem; opacity:.35; pointer-events:none; z-index:0;
    animation:drift linear infinite;}
  @keyframes drift{
    from{transform:translateY(105vh) rotate(-10deg);}
    to{transform:translateY(-10vh) rotate(10deg);}
  }
  @media (prefers-reduced-motion: reduce){
    .float{display:none;}
    *{animation-duration:.01s !important;}
  }
  .screen{display:none; flex-direction:column; align-items:center; z-index:1; width:100%; padding-bottom:90px;}
  .screen.on{display:flex;}
  h1{margin:14px 0 4px; font-size:clamp(1.5rem,5vw,2.2rem); letter-spacing:1px;
     color:var(--accent); text-shadow:0 2px 0 #fff; text-align:center;}
  .hud{display:flex; gap:10px; align-items:center; margin:8px 0 12px; flex-wrap:wrap; justify-content:center;}
  .hud .lv{user-select:none; -webkit-user-select:none; touch-action:none;
    background:var(--card); border:3px solid var(--line); border-radius:999px;
    padding:6px 18px; font-weight:bold; font-size:1.1rem; box-shadow:0 3px 0 var(--line);}
  button.round{background:var(--card); border:3px solid var(--line); border-radius:999px;
    width:46px; height:46px; font-size:1.3rem; cursor:pointer; box-shadow:0 3px 0 var(--line); font-family:inherit;}
  button.round:active{transform:translateY(2px); box-shadow:none;}
  #sndBtn{position:fixed; top:10px; right:10px; z-index:4;}
  #fsBtn{position:fixed; top:10px; right:64px; z-index:4;}

  /* home */
  /* title: generated banner (title.webp), edges pre-faded to transparent.
     top margin keeps the sign clear of the fixed sound/fullscreen buttons */
  #home .title{margin:40px 0 -2%; width:100%; max-width:720px;}
  #home .title img{display:block; width:100%; height:auto;}
  #home .cards{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,170px)); gap:16px;
    justify-content:center; padding:10px; max-width:420px;}
  /* tablet and up: 4 across (8 games = 4x2); phones stay 2 across */
  @media (min-width:700px){
    #home .cards{grid-template-columns:repeat(4,minmax(150px,170px)); max-width:100%;}
  }
  .gcard{background:var(--card); border:4px solid var(--line); border-radius:24px;
    padding:18px 10px 14px; text-align:center; cursor:pointer;
    box-shadow:0 6px 0 var(--line); transition:transform .12s;}
  .gcard:active{transform:translateY(4px); box-shadow:none;}
  .gcard .ico{font-size:3rem; display:block; margin-bottom:6px;}
  .gcard .nm{font-weight:bold; font-size:1.05rem; word-break:keep-all;}
  .gcard .pg{font-size:.85rem; color:#b78fb0; margin-top:4px;}

  /* generic board card */
  .boardCard{background:var(--card); padding:12px; border-radius:24px; border:4px solid var(--line);
    box-shadow:0 8px 24px rgba(255,123,172,.25); touch-action:none;}

  /* sudoku */
  #sdBoard{display:grid; gap:5px;}
  .cell{
    width:var(--cs); height:var(--cs); border-radius:14px;
    display:flex; align-items:center; justify-content:center;
    font-size:calc(var(--cs)*.62); background:#fff2f8; border:2px solid #ffd9ea;
    cursor:pointer; transition:transform .12s;
  }
  #sdBoard.num .cell, #sdPalette.num .pal{font-weight:900; color:#7a4f6b;}
  .cell.given{background:#fdfdfd; border-color:#e9e4ee; cursor:default;}
  .cell.empty{border-style:dashed; border-color:var(--accent2); background:#f2f8ff;}
  .cell.sel{outline:4px solid var(--accent); outline-offset:-2px; transform:scale(1.06);}
  .gapR{margin-right:8px;} .gapB{margin-bottom:8px;}
  .pop{animation:pop .35s;}
  @keyframes pop{0%{transform:scale(.3);}60%{transform:scale(1.25);}100%{transform:scale(1);}}
  .shake{animation:shake .4s;}
  @keyframes shake{0%,100%{transform:translateX(0);}25%{transform:translateX(-7px);}
    50%{transform:translateX(7px);}75%{transform:translateX(-4px);}}
  #sdPalette{display:flex; gap:10px; margin:16px 0 8px; flex-wrap:wrap; justify-content:center;}
  .pal{width:60px; height:60px; font-size:2rem; border-radius:18px;
    background:var(--card); border:3px solid var(--line); cursor:pointer;
    box-shadow:0 4px 0 var(--line); transition:transform .12s; font-family:inherit;}
  .pal:active{transform:translateY(3px); box-shadow:none;}
  .pal.selP{border-color:var(--accent); background:#fff0f7; transform:scale(1.1);}

  /* rush hour */
  #rushWrap{position:relative;}
  #rushBoard{position:relative; display:grid; grid-template-columns:repeat(6,var(--rc)); gap:4px;}
  .rcell{width:var(--rc); height:var(--rc); border-radius:10px; background:#fff2f8; border:2px solid #ffd9ea;}
  .piece{position:absolute; border-radius:calc(var(--rc)*.28)/calc(var(--rc)*.34);
    display:flex; align-items:center; justify-content:center;
    font-size:calc(var(--rc)*.46); cursor:grab; border:3px solid rgba(255,255,255,.7);
    background-color:var(--car,#ffb1cf); background-repeat:no-repeat;
    box-shadow:0 3px 6px rgba(0,0,0,.12); transition:box-shadow .15s; z-index:2; touch-action:none;}
  /* cabin: sits under the emoji (z-index:-1 keeps it above the body, below the face) */
  .piece::before{content:''; position:absolute; z-index:-1; background:rgba(255,255,255,.62);
    border-radius:calc(var(--rc)*.2);}
  .piece.h::before{left:calc(50% - var(--rc)*.35); width:calc(var(--rc)*.7); top:14%; bottom:14%;}
  .piece.v::before{top:calc(50% - var(--rc)*.35); height:calc(var(--rc)*.7); left:14%; right:14%;}
  /* 4 wheels from one element: box-shadow clones it along the car and across it.
     --span is axle-to-axle distance, so it depends on car length (--len). */
  .piece::after{content:''; position:absolute; background:#3a3a44;
    border-radius:calc(var(--rc)*.05);
    --span:calc((var(--len) - .66)*var(--rc) + (var(--len) - 1)*4px);}
  .piece.h::after{width:calc(var(--rc)*.3); height:calc(var(--rc)*.13);
    left:calc(var(--rc)*.18); top:calc(var(--rc)*-.04);
    box-shadow:var(--span) 0 0 #3a3a44, 0 calc(var(--rc)*.95) 0 #3a3a44,
               var(--span) calc(var(--rc)*.95) 0 #3a3a44;}
  .piece.v::after{width:calc(var(--rc)*.13); height:calc(var(--rc)*.3);
    top:calc(var(--rc)*.18); left:calc(var(--rc)*-.04);
    box-shadow:0 var(--span) 0 #3a3a44, calc(var(--rc)*.95) 0 0 #3a3a44,
               calc(var(--rc)*.95) var(--span) 0 #3a3a44;}
  .piece.hero{--car:#ffb1cf; z-index:3;}
  .piece.drag{box-shadow:0 8px 16px rgba(0,0,0,.2); cursor:grabbing;}
  #rushExit{position:absolute; font-size:1.6rem; pointer-events:none;}
  .slideOut{transition:left .6s ease-in !important;}

  /* flow */
  #flowBoard{display:grid; gap:4px;}
  .fcell{width:var(--fc); height:var(--fc); border-radius:12px; background:#fff2f8; border:2px solid #ffd9ea;
    display:flex; align-items:center; justify-content:center; font-size:calc(var(--fc)*.6);}
  .fcell .dot{width:35%; height:35%; border-radius:50%;}
  .fcell.fdone{animation:pop .35s;}

  /* sokoban */
  #sokoBoard{display:grid; gap:3px;}
  .scell{width:var(--sc); height:var(--sc); border-radius:8px;
    display:flex; align-items:center; justify-content:center; font-size:calc(var(--sc)*.68);}
  .scell.floor{background:#fff7fb;}
  .scell.wall{background:linear-gradient(135deg,#ffc4dc,#f9a8c9); border:2px solid #f393bd; border-radius:6px;}
  .scell.plate{background:#fff7fb; box-shadow:inset 0 0 0 4px #ffd93d; }
  .scell .onPlate{filter:drop-shadow(0 0 6px #ffd93d);}
  #dpad,#mzPad{display:grid; grid-template-columns:repeat(3,56px); gap:6px; margin-top:14px;}
  #dpad button,#mzPad button{height:52px; font-size:1.4rem;}
  #dpad .blank,#mzPad .blank{visibility:hidden;}

  /* memory */
  #memBoard{display:grid; gap:8px; justify-content:center;}
  .mcard{width:var(--mc); height:var(--mc); border-radius:16px; cursor:pointer;
    display:flex; align-items:center; justify-content:center; font-size:calc(var(--mc)*.55);
    background:linear-gradient(145deg,#ffd3e4,#ffb1cf); border:3px solid var(--line);
    box-shadow:0 4px 0 var(--line);}
  .mcard.up{background:#fffdfa;}
  .mcard.done{background:#e8f8e6; border-color:var(--good); cursor:default; opacity:.7;}

  /* maze */
  #mzBoard{display:grid; border-radius:12px; overflow:hidden;}
  .zcell{width:var(--zc); height:var(--zc); display:flex; align-items:center;
    justify-content:center; font-size:calc(var(--zc)*.78);}
  .zcell.wall{background:#c79bb4;}
  .zcell.floor{background:#fff6fb;}

  /* odd one out */
  #oddBoard{display:grid; gap:6px; justify-content:center;}
  .ocell{width:var(--oc); height:var(--oc); border-radius:14px; background:#fff2f8;
    border:2px solid #ffd9ea; cursor:pointer; display:flex; align-items:center;
    justify-content:center; font-size:calc(var(--oc)*.66);}
  .ocell.got{background:#e8f8e6; border-color:var(--good); cursor:default;}

  /* pattern */
  #patSeq{display:flex; flex-wrap:wrap; gap:8px; justify-content:center; max-width:420px;}
  .pcell{width:var(--pc); height:var(--pc); border-radius:14px; background:#fff2f8;
    border:2px solid #ffd9ea; display:flex; align-items:center; justify-content:center;
    font-size:calc(var(--pc)*.6);}
  .pcell.gap{border-style:dashed; border-color:var(--accent); background:#f2f8ff; font-weight:900;}
  #patOpts{display:flex; gap:10px; flex-wrap:wrap; justify-content:center; margin-top:18px;}

  /* mascot + overlay */
  #mascot{position:fixed; bottom:10px; left:50%; transform:translateX(-50%);
    z-index:3; display:flex; align-items:center; gap:8px;
    background:var(--card); border:3px solid var(--line); border-radius:20px;
    padding:8px 16px; max-width:92vw; box-shadow:0 4px 10px rgba(255,123,172,.2);}
  #mascot .face{font-size:2rem;}
  #mascot .say{font-size:1rem; font-weight:bold;}
  #win{position:fixed; inset:0; background:rgba(255,230,242,.85); z-index:5;
    display:none; flex-direction:column; align-items:center; justify-content:center; gap:14px;}
  #win.show{display:flex;}
  #win .big{font-size:3rem; animation:pop .5s;}
  #win h2{margin:0; font-size:2rem; color:var(--accent);}
  .bigBtn{font-size:1.3rem; padding:14px 30px; border-radius:999px; cursor:pointer;
    background:var(--accent); color:#fff; border:none; box-shadow:0 5px 0 #d55a8c;
    font-family:inherit; font-weight:bold;}
  .bigBtn.alt{background:var(--accent2); box-shadow:0 5px 0 #5f9bd6;}
  .bigBtn:active{transform:translateY(3px); box-shadow:none;}
  #confetti{position:fixed; inset:0; pointer-events:none; z-index:6;}
</style>

<button class="round" id="fsBtn">⛶</button>
<button class="round" id="sndBtn">🔊</button>

<div class="screen on" id="home">
  <h1 class="title"><img src="title.webp" width="1440" height="516" alt="두근두근 퍼즐랜드 — 어떤 퍼즐을 해볼까?"></h1>
  <div class="cards">
    <div class="gcard" data-g="sudoku"><span class="ico">🍓</span><div class="nm">그림 스도쿠</div><div class="pg"></div></div>
    <div class="gcard" data-g="rush"><span class="ico">🚗</span><div class="nm">주차장 탈출</div><div class="pg"></div></div>
    <div class="gcard" data-g="flow"><span class="ico">🎨</span><div class="nm">동물 짝 잇기</div><div class="pg"></div></div>
    <div class="gcard" data-g="soko"><span class="ico">🍪</span><div class="nm">쿠키 밀기</div><div class="pg"></div></div>
    <div class="gcard" data-g="mem"><span class="ico">🎴</span><div class="nm">기억력 짝 맞추기</div><div class="pg"></div></div>
    <div class="gcard" data-g="maze"><span class="ico">🌀</span><div class="nm">미로 탈출</div><div class="pg"></div></div>
    <div class="gcard" data-g="pat"><span class="ico">🔎</span><div class="nm">패턴 이어가기</div><div class="pg"></div></div>
    <div class="gcard" data-g="odd"><span class="ico">🕵️</span><div class="nm">다른 거 찾기</div><div class="pg"></div></div>
  </div>
</div>

<div class="screen" id="g-sudoku">
  <h1>🍓 그림 스도쿠</h1>
  <div class="hud"><button class="round back">🏠</button><div class="lv"></div><button class="round" id="sdHint">💡</button></div>
  <div class="boardCard"><div id="sdBoard"></div></div>
  <div id="sdPalette"></div>
</div>

<div class="screen" id="g-rush">
  <h1>🚗 주차장 탈출</h1>
  <div class="hud"><button class="round back">🏠</button><div class="lv"></div><button class="round" id="rushReset">🔄</button></div>
  <div class="boardCard" id="rushWrap"><div id="rushBoard"></div><div id="rushExit">➡️🥕</div></div>
</div>

<div class="screen" id="g-flow">
  <h1>🎨 동물 짝 잇기</h1>
  <div class="hud"><button class="round back">🏠</button><div class="lv"></div><button class="round" id="flowReset">🔄</button></div>
  <div class="boardCard"><div id="flowBoard"></div></div>
</div>

<div class="screen" id="g-soko">
  <h1>🍪 쿠키 밀기</h1>
  <div class="hud"><button class="round back">🏠</button><div class="lv"></div>
    <button class="round" id="sokoUndo">↩️</button><button class="round" id="sokoReset">🔄</button></div>
  <div class="boardCard"><div id="sokoBoard"></div></div>
  <div id="dpad"></div>
</div>

<div class="screen" id="g-mem">
  <h1>🎴 기억력 짝 맞추기</h1>
  <div class="hud"><button class="round back">🏠</button><div class="lv"></div><button class="round" id="memReset">🔄</button></div>
  <div class="boardCard"><div id="memBoard"></div></div>
</div>

<div class="screen" id="g-maze">
  <h1>🌀 미로 탈출</h1>
  <div class="hud"><button class="round back">🏠</button><div class="lv"></div><button class="round" id="mzReset">🔄</button></div>
  <div class="boardCard"><div id="mzBoard"></div></div>
  <div id="mzPad"></div>
</div>

<div class="screen" id="g-pat">
  <h1>🔎 패턴 이어가기</h1>
  <div class="hud"><button class="round back">🏠</button><div class="lv"></div><button class="round" id="patReset">🔄</button></div>
  <div class="boardCard"><div id="patSeq"></div></div>
  <div id="patOpts"></div>
</div>

<div class="screen" id="g-odd">
  <h1>🕵️ 다른 거 찾기</h1>
  <div class="hud"><button class="round back">🏠</button><div class="lv"></div><button class="round" id="oddReset">🔄</button></div>
  <div class="boardCard"><div id="oddBoard"></div></div>
</div>

<div id="mascot"><span class="face" id="mFace">🐰</span><span class="say" id="mSay">좋아하는 퍼즐을 골라봐!</span></div>

<div id="win">
  <div class="big" id="winEmoji">🎉</div>
  <h2>참 잘했어요!</h2>
  <button class="bigBtn" id="nextBtn">다음 레벨 ➜</button>
  <button class="bigBtn alt" id="homeBtn">🏠 홈으로</button>
</div>
<canvas id="confetti"></canvas>

const isImg = s => typeof s==='string' && s.slice(0,5)==='data:';
// every game shows its tokens through this, so an entry can be an emoji or a sprite
function put(el, s){
  if(isImg(s)){
    el.textContent='';
    el.style.backgroundImage='url("'+s+'")';
    el.style.backgroundSize='84%';
    el.style.backgroundPosition='center';
    el.style.backgroundRepeat='no-repeat';
  }else{
    el.style.backgroundImage='';
    el.textContent = s || '';
  }
}

let soundOn = true, AC=null;
function beep(freq, dur, delay=0, type='sine', vol=.18){
  if(!soundOn) return;
  AC = AC || new (window.AudioContext||window.webkitAudioContext)();
  const t = AC.currentTime + delay;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type=type; o.frequency.setValueAtTime(freq,t);
  g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.001,t+dur);
  o.connect(g).connect(AC.destination); o.start(t); o.stop(t+dur);
}
const sndPick  = ()=>beep(660,.08,0,'triangle');
const sndRight = ()=>{beep(660,.12); beep(990,.18,.09);};
const sndWrong = ()=>{beep(220,.25,0,'square',.08); beep(180,.3,.12,'square',.08);};
const sndHint  = ()=>{beep(880,.1); beep(1175,.15,.08);};
const sndStep  = ()=>beep(500,.05,0,'triangle',.08);
function sndWin(){ [523,659,784,1047,1319].forEach((f,i)=>beep(f,.35,i*.13,'triangle',.22)); }
$('#sndBtn').onclick=function(){ soundOn=!soundOn; this.textContent=soundOn?'🔊':'🔇'; };

const getLvl = k => +(localStorage.getItem('lvl_'+k) || (k==='sudoku' ? localStorage.getItem('sudokuLevel')||0 : 0));
const setLvl = (k,v) => localStorage.setItem('lvl_'+k, v);

// screens
let cur=null;
const GAMES={};
function show(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('on'));
  $('#'+id).classList.add('on');
}
function goHome(){
  cur=null; show('home');
  document.querySelectorAll('.gcard').forEach(c=>{
    const n=getLvl(c.dataset.g);
    c.querySelector('.pg').textContent = n ? '⭐ '+n : '아직 안 했어요';
  });
  say('좋아하는 퍼즐을 골라봐!', '🐰');
}
document.querySelectorAll('.gcard').forEach(c=>c.onclick=()=>{ sndPick(); startGame(c.dataset.g); });
document.querySelectorAll('.back').forEach(b=>b.onclick=()=>{ sndPick(); goHome(); });

// parent shortcut: press and hold the level pill for ~0.7s to jump to any level
document.querySelectorAll('.lv').forEach(el=>{
  el.title='길게 누르면 레벨 이동';
  let timer=null;
  const cancel=()=>{ clearTimeout(timer); timer=null; };
  el.addEventListener('pointerdown', ()=>{
    timer=setTimeout(()=>{
      if(!cur) return;
      const n=parseInt(prompt('레벨 번호 (1-100)', getLvl(cur.key)+1), 10);
      if(n>=1 && n<=100){ setLvl(cur.key, n-1); startGame(cur.key); }
    }, 700);
  });
  ['pointerup','pointerleave','pointercancel'].forEach(e=>el.addEventListener(e, cancel));
});
function startGame(key){
  goFull();
  cur=GAMES[key]; show('g-'+key);
  $('#g-'+key+' .lv').textContent = '레벨 ' + (getLvl(key)+1);
  cur.start(getLvl(key));
}

const cvs=$('#confetti'), ctx=cvs.getContext('2d');
function confetti(){
  cvs.width=innerWidth; cvs.height=innerHeight;
  const colors=['#ff7bac','#8ec9ff','#ffd93d','#63c97a','#c39bd3'];
  const parts=[...Array(120)].map(()=>({
    x:Math.random()*cvs.width, y:-20-Math.random()*cvs.height*.5,
    w:6+Math.random()*8, vy:2+Math.random()*3, vx:(Math.random()-.5)*2,
    rot:Math.random()*6, vr:(Math.random()-.5)*.3, col:rnd(colors)
  }));
  const t0=performance.now();
  (function tick(t){
    ctx.clearRect(0,0,cvs.width,cvs.height);
    for(const p of parts){
      p.y+=p.vy; p.x+=p.vx; p.rot+=p.vr;
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot);
      ctx.fillStyle=p.col; ctx.fillRect(-p.w/2,-p.w/2,p.w,p.w*.6);
      ctx.restore();
    }
    if(t-t0<3500) requestAnimationFrame(tick);
    else ctx.clearRect(0,0,cvs.width,cvs.height);
  })(t0);
}

    i<8  ? {size:4, blanks:4+i}                                  //   1- 8  pictures

  : i<36 ? {size:4, blanks:6+(i-30), num:true}                   //  31-36  numbers, small again
  : i<66 ? {size:6, blanks:Math.min(8+(i-36), 26), num:true}     //  37-66  numbers
         : {size:8, blanks:Math.min(14+(i-66), 45), num:true});  //  67-100 numbers
  let sol=[], grid=[], size=4, syms=[], selCell=null, selSym=null, remaining=0;

  function makeSolution(n){
    const boxH=2, boxW=n/2;
    let g=[...Array(n)].map((_,r)=>[...Array(n)].map((_,c)=>(r*boxW+Math.floor(r/boxH)+c)%n));
    const map = shuffle([...Array(n).keys()]);
    g = g.map(row=>row.map(v=>map[v]));
    const bandOrder = shuffle([...Array(n/boxH).keys()]);
    let rows=[];
    for(const b of bandOrder){ rows.push(...shuffle([b*boxH, b*boxH+1])); }
    g = rows.map(r=>g[r]);
    const stackOrder = shuffle([...Array(n/boxW).keys()]);
    let cols=[];
    for(const s of stackOrder){ cols.push(...shuffle([...Array(boxW).keys()].map(i=>s*boxW+i))); }
    return g.map(row=>cols.map(c=>row[c]));
  }
  function countSolutions(g, n, limit){
    const boxH=2, boxW=n/2;
    let count=0;
    (function solve(){
      for(let r=0;r<n;r++) for(let c=0;c<n;c++){
        if(g[r][c]===-1){
          for(let v=0;v<n;v++){
            let ok=true;
            for(let i=0;i<n;i++) if(g[r][i]===v||g[i][c]===v){ok=false;break;}
            if(ok){
              const r0=Math.floor(r/boxH)*boxH, c0=Math.floor(c/boxW)*boxW;
              for(let i=r0;i<r0+boxH&&ok;i++) for(let j=c0;j<c0+boxW;j++) if(g[i][j]===v){ok=false;break;}
            }
            if(ok){ g[r][c]=v; solve(); g[r][c]=-1; if(count>=limit) return; }
          }
          return;
        }
      }
      count++;
    })();
    return count;
  }
  function makePuzzle(n, blanks){
    sol = makeSolution(n);
    grid = sol.map(r=>[...r]);
    const cells = shuffle([...Array(n*n).keys()]);
    let removed=0;
    for(const idx of cells){
      if(removed>=blanks) break;
      const r=Math.floor(idx/n), c=idx%n, keep=grid[r][c];
      grid[r][c]=-1;
      if(countSolutions(grid.map(x=>[...x]), n, 2)===1) removed++;
      else grid[r][c]=keep;
    }
    remaining = removed;
  }
  const board=$('#sdBoard'), palette=$('#sdPalette');
  function start(level){
    const cfg = LEVELS[Math.min(level, LEVELS.length-1)];
    size = cfg.size;
    const useNum = !!cfg.num;
    syms = (useNum ? DIGITS : rnd(SYMBOLS)).slice(0, size);
    board.classList.toggle('num', useNum);
    palette.classList.toggle('num', useNum);
    makePuzzle(size, cfg.blanks);
    selCell=null; selSym=null;
    const cs = Math.min((Math.min(innerWidth,480)-80)/size, 78);
    board.style.setProperty('--cs', cs+'px');
    board.style.gridTemplateColumns = `repeat(${size}, auto)`;
    board.innerHTML='';
    const boxW=size/2;
    for(let r=0;r<size;r++) for(let c=0;c<size;c++){
      const d=document.createElement('div');
      d.className='cell ' + (grid[r][c]===-1?'empty':'given');
      if((c+1)%boxW===0 && c!==size-1) d.classList.add('gapR');
      if((r+1)%2===0 && r!==size-1) d.classList.add('gapB');
      put(d, grid[r][c]===-1 ? '' : syms[grid[r][c]]);
      d.dataset.r=r; d.dataset.c=c;
      if(grid[r][c]===-1) d.onclick=()=>pickCell(d);
      board.appendChild(d);
    }
    palette.innerHTML='';
    syms.forEach((s,v)=>{
      const b=document.createElement('button');
      b.className='pal'; put(b, s);
      b.onclick=()=>pickSym(b,v);
      palette.appendChild(b);
    });
    say(useNum ? '숫자를 골라서 빈칸을 채워봐!' : '그림을 골라서 빈칸을 채워봐!', '🐰');
  }
  function pickCell(d){
    sndPick();
    if(selCell) selCell.classList.remove('sel');
    selCell=d; d.classList.add('sel');
    if(selSym!==null) tryPlace();
  }
  function pickSym(b,v){
    sndPick();
    [...palette.children].forEach(x=>x.classList.remove('selP'));
    b.classList.add('selP'); selSym=v;
    if(selCell) tryPlace();
  }
  function tryPlace(){
    const r=+selCell.dataset.r, c=+selCell.dataset.c;
    if(sol[r][c]===selSym){
      grid[r][c]=selSym;
      put(selCell, syms[selSym]);
      selCell.className='cell pop';
      selCell.onclick=null;
      selCell=null; remaining--;
      sndRight(); say(rnd(CHEERS), '🐰');
      if(remaining===0) win();
    }else{
      sndWrong();
      const el=selCell;
      el.classList.add('shake');
      setTimeout(()=>el.classList.remove('shake'), 450);
      say(rnd(OOPS), '🐻');
    }
  }
  $('#sdHint').onclick=()=>{
    const empties=[...board.children].filter(d=>d.classList.contains('empty'));
    if(!empties.length) return;
    const d=rnd(empties);
    const r=+d.dataset.r, c=+d.dataset.c;
    grid[r][c]=sol[r][c];
    put(d, syms[sol[r][c]]);
    d.className='cell pop'; d.onclick=null;
    if(selCell===d) selCell=null;
    remaining--; sndHint();
    say('토끼가 살짝 도와줬어! 🤫', '🐰');
    if(remaining===0) win();
  };
  GAMES.sudoku={key:'sudoku', start};
})();

// ================= RUSH HOUR =================
(function(){
  // first piece = hero (row 2, horizontal). Levels generated: BFS solver
  // measures min slides, generator retries until difficulty fits the level.
  function solveMin(ps){
    let q=[ps.map(p=>p.d==='h'?p.c:p.r)];
    const seen=new Set([q[0].join(',')]);
    for(let depth=0; q.length && depth<40; depth++){
      const nq=[];
      for(const pos of q){
        if(pos[0]+ps[0].l===6) return depth;
        const occ=new Set();
        ps.forEach((p,i)=>{ for(let k=0;k<p.l;k++)
          occ.add(p.d==='h'? p.r+','+(pos[i]+k) : (pos[i]+k)+','+p.c); });
        ps.forEach((p,i)=>{
          const at = x => p.d==='h'? p.r+','+x : x+','+p.c;
          for(let np=pos[i]-1; np>=0 && !occ.has(at(np)); np--){
            const nx=[...pos]; nx[i]=np; const key=nx.join(',');
            if(!seen.has(key)){ seen.add(key); nq.push(nx); }
          }
          for(let np=pos[i]+1; np+p.l<=6 && !occ.has(at(np+p.l-1)); np++){
            const nx=[...pos]; nx[i]=np; const key=nx.join(',');
            if(!seen.has(key)){ seen.add(key); nq.push(nx); }
          }
        });
      }
      q=nq;
    }
    return -1;
  }
  function genRush(level){
    const nV = Math.min(2+Math.floor(level/7), 13);          // extra vehicles
    const lo = Math.min(1+Math.floor(level/9), 12), hi=lo+5; // target min slides
    // ponytail: 6x6 tops out near 20 min-slides and solveMin costs ~10ms, so the
    // search is time-boxed and falls back to the hardest board it found. Late
    // levels get their difficulty from vehicle count, not from min-slides.
    let best=null; const t0=Date.now();
    for(let t=0;t<400 && Date.now()-t0<250;t++){
      const ps=[{r:2, c:Math.floor(Math.random()*3), l:2, d:'h'}];
      const occ=new Set(['2,'+ps[0].c, '2,'+(ps[0].c+1)]);
      let guard=0;
      while(ps.length<1+nV && guard++<120){
        const d=Math.random()<.5?'h':'v', l=Math.random()<.25?3:2;
        const r=Math.floor(Math.random()*6), c=Math.floor(Math.random()*6);
        if(d==='h' && r===2) continue;                      // no rivals on exit row
        if(d==='h' ? c+l>6 : r+l>6) continue;
        const cells=[];
        let free=true;
        for(let k=0;k<l;k++){
          const key = d==='h' ? r+','+(c+k) : (r+k)+','+c;
          if(occ.has(key)){ free=false; break; }
          cells.push(key);
        }
        if(!free) continue;
        cells.forEach(x=>occ.add(x));
        ps.push({r,c,l,d});
      }
      const m=solveMin(ps);
      if(m>=lo && m<=hi) return ps;
      if(m>0 && (!best || m>best.m)) best={ps,m};  // no band hit: take hardest found
    }

  }
  const FACES=[SPR.m[3],SPR.m[5],SPR.m[6],SPR.m[10],SPR.m[13],SPR.m[14],SPR.m[16],SPR.m[19]];
  const COLORS=['#a8d8ff','#ffe9a8','#c7f0c2','#e3c9f5','#ffd7b3','#c2ecf0','#f5d0c9','#d6e5c8'];
  const board=$('#rushBoard'), wrap=$('#rushWrap');
  let pieces=[], cs=60, done=false;

  function occ(exclude){
    const s=new Set();
    pieces.forEach((p,i)=>{ if(i===exclude) return;
      for(let k=0;k<p.l;k++) s.add(p.d==='h' ? p.r+','+(p.c+k) : (p.r+k)+','+p.c);
    });
    return s;
  }
  let layout=[];
  function start(level){
    layout = genRush(Math.min(level, 99));
    load();
  }
  function load(){
    done=false;
    pieces = layout.map(p=>({...p}));
    [...wrap.querySelectorAll('.piece')].forEach(x=>x.remove());
    cs = Math.min((Math.min(innerWidth,480)-90)/6, 62);
    wrap.style.setProperty('--rc', cs+'px');   // pieces are wrap's children, need it too
    board.innerHTML='';
    for(let i=0;i<36;i++) board.appendChild(Object.assign(document.createElement('div'),{className:'rcell'}));
    const gap=4;
    pieces.forEach((p,i)=>{
      const d=document.createElement('div');
      d.className='piece '+p.d+(i===0?' hero':'');
      d.style.setProperty('--len', p.l);   // wheel spacing is length-dependent
      d.style.width = (p.d==='h'? p.l*cs+(p.l-1)*gap : cs)+'px';
      d.style.height= (p.d==='v'? p.l*cs+(p.l-1)*gap : cs)+'px';
      d.style.left = 12+p.c*(cs+gap)+'px';
      d.style.top  = 12+p.r*(cs+gap)+'px';
      if(i>0) d.style.setProperty('--car', COLORS[i%COLORS.length]);
      put(d, i===0 ? '🐰' : FACES[i%FACES.length]);
      d.dataset.i=i;
      d.addEventListener('pointerdown', dragStart);
      wrap.appendChild(d);
    });
    const exit=$('#rushExit');
    exit.style.top = 12+2*(cs+gap)+cs*.2+'px';
    exit.style.right='-14px';
    say('🐰 토끼차가 나갈 수 있게 길을 만들어줘!', '🐰');
  }
  function dragStart(e){
    if(done) return;
    const el=e.currentTarget, i=+el.dataset.i, p=pieces[i], gap=4, unit=cs+gap;
    el.setPointerCapture(e.pointerId);
    el.classList.add('drag');
    const o=occ(i);
    // free slide range in cells
    let lo=p.d==='h'?p.c:p.r, hi=lo;
    const fixed = p.d==='h'?p.r:p.c;
    const cellAt = x => p.d==='h' ? p.r+','+x : x+','+p.c;
    while(lo>0 && !o.has(cellAt(lo-1))) lo--;
    while(hi + p.l < 6 && !o.has(cellAt(hi+p.l))) hi++;

    const startPx = startPos*unit;
    const sx=e.clientX, sy=e.clientY;
    function mv(ev){
      let delta = p.d==='h' ? ev.clientX-sx : ev.clientY-sy;
      let px = Math.max(lo*unit, Math.min(hi*unit, startPx+delta));
      el.style[p.d==='h'?'left':'top'] = 12+px+'px';
    }
    function up(ev){
      el.classList.remove('drag');
      el.removeEventListener('pointermove', mv);
      el.removeEventListener('pointerup', up);
      const cur = parseFloat(el.style[p.d==='h'?'left':'top'])-12;
      const snapped = Math.max(lo, Math.min(hi, Math.round(cur/unit)));
      el.style[p.d==='h'?'left':'top'] = 12+snapped*unit+'px';
      const moved = snapped !== startPos;
      if(p.d==='h') p.c=snapped; else p.r=snapped;
      if(moved) sndStep();
      if(i===0 && p.c+p.l===6){ // hero at exit
        done=true;
        sndRight();
        el.classList.add('slideOut');
        el.style.left = 12+8*unit+'px';
        say('부릉부릉~ 탈출 성공! 🥕','🐰');
        setTimeout(win, 500);
      }
    }
    el.addEventListener('pointermove', mv);
    el.addEventListener('pointerup', up);
  }
  $('#rushReset').onclick=()=>{ sndPick(); load(); }; // same layout, not a re-generate
  GAMES.rush={key:'rush', start};
})();

// ================= FLOW (동물 짝 잇기) =================
(function(){
  const ANIMALS=[SPR.k[0],SPR.k[2],SPR.k[5],SPR.k[7],SPR.k[9],SPR.k[14]];
  const TINT=['#ffd3e4','#ffe9b8','#cdeafc','#d5f2cd','#e6d4f7','#ffd9c4'];
  // 100 levels: grid 4→9, pairs 3→9
  const LEVELS=[...Array(100)].map((_,i)=>({
    n: i<4?4 : i<12?5 : i<22?6 : i<40?7 : i<65?8 : 9,
    k: Math.min(3+Math.floor(i/11), 9),
  }));
  const board=$('#flowBoard');
  let n=4, ends=[], owner={}, paths=[], doneArr=[], active=-1, cells=[];

  function generate(n,k){
    for(let attempt=0; attempt<800; attempt++){
      const unvis=new Set();
      for(let i=0;i<n*n;i++) unvis.add(i);
      const ps=[];
      let ok=true;
      while(unvis.size){
        const start=rnd([...unvis]);
        unvis.delete(start);
        const path=[start];
        while(true){
          const last=path[path.length-1], r=Math.floor(last/n), c=last%n;
          const nb=shuffle([[r-1,c],[r+1,c],[r,c-1],[r,c+1]]
            .filter(([a,b])=>a>=0&&a<n&&b>=0&&b<n&&unvis.has(a*n+b))
            .map(([a,b])=>a*n+b));
          if(!nb.length) break;
          const nx=nb[0];
          unvis.delete(nx); path.push(nx);
        }
        if(path.length<3){ ok=false; break; }
        ps.push(path);
      }
      if(ok && Math.abs(ps.length-k)<=1) return ps;
    }
    return null;
  }
  function start(level){
    const cfg=LEVELS[Math.min(level, LEVELS.length-1)];
    n=cfg.n;
    let ps=generate(n,cfg.k);
    if(!ps) ps = generate(n, cfg.k-1) || generate(n, 3) || ((n=4), generate(4,3));
    ends = ps.map(p=>[p[0], p[p.length-1]]);
    paths = ps.map(()=>[]); doneArr = ps.map(()=>false);
    owner={}; active=-1;
    ends.forEach((e,ci)=>{ owner[e[0]]='e'+ci; owner[e[1]]='e'+ci; });
    const fc = Math.min((Math.min(innerWidth,480)-80)/n, 70);
    board.style.setProperty('--fc', fc+'px');
    board.style.gridTemplateColumns=`repeat(${n}, auto)`;
    board.innerHTML=''; cells=[];
    for(let i=0;i<n*n;i++){
      const d=document.createElement('div');
      d.className='fcell'; d.dataset.i=i;
      board.appendChild(d); cells.push(d);
    }
    board.onpointerdown=pd; board.onpointermove=pm;
    paint();
    say('같은 동물 친구끼리 손가락으로 이어줘!', '🐰');
  }
  function paint(){
    cells.forEach(d=>{
      d.style.background='#fff2f8'; put(d,''); d.style.boxShadow='';
      d.classList.remove('fdone');
    });
    paths.forEach((p,ci)=>p.forEach(i=>{ cells[i].style.background=TINT[ci]; }));
    ends.forEach((e,ci)=>e.forEach(i=>{
      put(cells[i], ANIMALS[ci]);
      cells[i].style.boxShadow='inset 0 0 0 3px '+TINT[ci];
      if(paths[ci].includes(i)||doneArr[ci]) cells[i].style.background=TINT[ci];
      if(doneArr[ci]) cells[i].classList.add('fdone');
    }));
  }
  const isEnd=(i,ci)=>ends[ci][0]===i||ends[ci][1]===i;
  function cellFromEvent(e){
    const el=document.elementFromPoint(e.clientX,e.clientY);
    if(el&&el.classList.contains('fcell')) return +el.dataset.i;
    if(el&&el.parentElement&&el.parentElement.classList&&el.parentElement.classList.contains('fcell')) return +el.parentElement.dataset.i;
    return -1;
  }
  function pd(e){
    const i=cellFromEvent(e);
    if(i<0) return;
    const ci=ends.findIndex(en=>en[0]===i||en[1]===i);
    if(ci>=0){
      // clear old path of this color
      paths[ci].forEach(x=>{ if(!isEnd(x,ci)) delete owner[x]; });
      paths[ci]=[i]; doneArr[ci]=false; active=ci;
      sndPick(); paint();
    }
  }
  function pm(e){
    if(active<0||doneArr[active]) return;
    const i=cellFromEvent(e);
    if(i<0) return;
    const ci=active, p=paths[ci], last=p[p.length-1];
    if(i===last) return;
    const dr=Math.abs(Math.floor(i/n)-Math.floor(last/n)), dc=Math.abs(i%n-last%n);
    if(dr+dc!==1) return;
    if(p.length>1 && i===p[p.length-2]){ // backtrack
      const rm=p.pop(); if(!isEnd(rm,ci)) delete owner[rm];
      paint(); return;
    }
    const ow=owner[i];
    if(ow==='e'+ci){ // reached endpoint
      if(i===p[0]) return;
      p.push(i); doneArr[ci]=true; active=-1;
      sndRight(); say(rnd(CHEERS),'🐰'); paint();
      if(doneArr.every(Boolean)) setTimeout(win, 300);
      return;
    }
    if(ow!==undefined) return; // occupied by other color / endpoint
    if(p.includes(i)) return;
    owner[i]='p'+ci; p.push(i);
    paint();
  }
  document.addEventListener('pointerup', ()=>{ active=-1; });
  $('#flowReset').onclick=()=>{
    sndPick();
    paths.forEach((p,ci)=>{ p.forEach(x=>{ if(!isEnd(x,ci)) delete owner[x]; }); paths[ci]=[]; doneArr[ci]=false; });
    paint();
  };
  GAMES.flow={key:'flow', start};
})();

        return {w, pl, bx, player:[pr,pc], gw, gh};
    }
    return null; // fall back to hand levels
  }
  function start(level){
    walls=new Set(); plates=new Set(); boxes=new Set(); undoStack=[];
    const g = level>=HAND.length ? genSoko(level) : null;
    if(g){
      walls=g.w; plates=g.pl; boxes=g.bx; player=g.player; W=g.gw; H=g.gh;
    }else{
      const map=HAND[Math.min(level, HAND.length-1)];
      H=map.length; W=map[0].length;
      map.forEach((row,r)=>[...row].forEach((ch,c)=>{
        if(ch==='#') walls.add(K(r,c));
        if(ch==='o'||ch==='*'||ch==='+') plates.add(K(r,c));
        if(ch==='$'||ch==='*') boxes.add(K(r,c));
        if(ch==='@'||ch==='+') player=[r,c];
      }));
    }
    init={p:[...player], b:[...boxes]};
    const sc=Math.min((Math.min(innerWidth,480)-70)/W, 56);
    board.style.setProperty('--sc', sc+'px');
    board.style.gridTemplateColumns=`repeat(${W}, auto)`;
    render();
    say('쿠키를 노란 접시까지 밀어줘! 🍪', '🐰');
  }
  function render(){
    board.innerHTML='';
    for(let r=0;r<H;r++) for(let c=0;c<W;c++){
      const d=document.createElement('div');
      const k=K(r,c);
      d.className='scell '+(walls.has(k)?'wall':plates.has(k)?'plate':'floor');
      if(boxes.has(k)) d.innerHTML = plates.has(k) ? '<span class="onPlate">🍪</span>' : '🍪';
      if(player[0]===r&&player[1]===c) put(d, SPR.k[10]);   // 커비가 쿠키를 민다
      board.appendChild(d);
    }
  }
  function move(dr,dc){
    const [r,c]=player, nr=r+dr, nc=c+dc, nk=K(nr,nc);
    if(walls.has(nk)) return;
    if(boxes.has(nk)){
      const br=nr+dr, bc=nc+dc, bk=K(br,bc);
      if(walls.has(bk)||boxes.has(bk)){ sndWrong(); return; }
      undoStack.push({p:[r,c], b:[...boxes]});
      boxes.delete(nk); boxes.add(bk);
      player=[nr,nc];
      if(plates.has(bk)){ sndRight(); say(rnd(CHEERS),'🐰'); }
      else sndStep();
    }else{
      undoStack.push({p:[r,c], b:[...boxes]});
      player=[nr,nc]; sndStep();
    }
    if(undoStack.length>200) undoStack.shift();
    render();
    if([...boxes].every(b=>plates.has(b))) setTimeout(win, 300);
  }
  // d-pad
  const pad=$('#dpad');
  [['',''],['⬆️','-1,0'],['',''],
   ['⬅️','0,-1'],['⬇️','1,0'],['➡️','0,1']].forEach(([t,dd])=>{
    if(!t){ const s=document.createElement('span'); s.className='blank'; pad.appendChild(s); return; }
    const b=document.createElement('button');
    b.className='round'; b.textContent=t;
    b.onclick=()=>{ const [dr,dc]=dd.split(',').map(Number); move(dr,dc); };
    pad.appendChild(b);
  });
  // swipe
  let sw=null;
  board.addEventListener('pointerdown',e=>{ sw=[e.clientX,e.clientY]; });
  board.addEventListener('pointerup',e=>{
    if(!sw) return;
    const dx=e.clientX-sw[0], dy=e.clientY-sw[1]; sw=null;
    if(Math.max(Math.abs(dx),Math.abs(dy))<24) return;
    if(Math.abs(dx)>Math.abs(dy)) move(0, dx>0?1:-1);
    else move(dy>0?1:-1, 0);
  });
  document.addEventListener('keydown',e=>{
    if(!$('#g-soko').classList.contains('on')||$('#win').classList.contains('show')) return;
    const m={ArrowUp:[-1,0],ArrowDown:[1,0],ArrowLeft:[0,-1],ArrowRight:[0,1]}[e.key];
    if(m){ e.preventDefault(); move(...m); }
  });
  $('#sokoUndo').onclick=()=>{
    const u=undoStack.pop();
    if(!u) return;
    player=u.p; boxes=new Set(u.b); sndPick(); render();
  };
  $('#sokoReset').onclick=()=>{ // same layout, not a re-generate
    sndPick(); player=[...init.p]; boxes=new Set(init.b); undoStack=[]; render();
  };
  GAMES.soko={key:'soko', start};
})();

// ================= MEMORY (기억력 짝 맞추기) =================
(function(){
  const POOL=SPR.c.slice(0,9).concat(
             ['🐰','🐱','🐶','🦊','🐼','🐻','🐷','🐸','🐯','🦁','🐮','🐵',
              '🍓','🍊','🍇','🍉','🍑','🥝','🐔','🦄','🐙']);
  // 100 levels: 2 pairs -> 18 pairs (the whole pool)
  const LEVELS=[...Array(100)].map((_,i)=>({pairs: Math.min(2+Math.floor(i/5), POOL.length)}));
  const board=$('#memBoard');
  let deck=[], up=[], matched=0, lock=false;

  function start(level){
    const pairs=LEVELS[Math.min(level, LEVELS.length-1)].pairs;
    const faces=shuffle([...POOL]).slice(0, pairs);
    deck=shuffle([...faces, ...faces]);
    up=[]; matched=0; lock=false;
    const cols=Math.min(Math.ceil(Math.sqrt(deck.length)), 6);
    const mc=Math.min((Math.min(innerWidth,480)-80)/cols, 76);
    board.style.setProperty('--mc', mc+'px');
    board.style.gridTemplateColumns='repeat('+cols+', auto)';
    board.innerHTML='';
    deck.forEach((f,i)=>{
      const d=document.createElement('div');
      d.className='mcard';
      d.onclick=()=>flip(d,i);
      board.appendChild(d);
    });
    say('같은 그림 두 장을 찾아봐! 🎴','🐰');
  }
  function flip(el,i){
    if(lock || el.classList.contains('up') || el.classList.contains('done')) return;
    el.classList.add('up','pop'); put(el, deck[i]);
    setTimeout(()=>el.classList.remove('pop'), 350);
    sndPick();
    up.push({el:el, i:i});
    if(up.length<2) return;
    const a=up[0], b=up[1]; up=[];
    if(deck[a.i]===deck[b.i]){
      a.el.classList.add('done'); b.el.classList.add('done');
      matched++; sndRight();
      if(matched===deck.length/2){ setTimeout(win, 400); return; }
      say(rnd(CHEERS),'👧');
    }else{
      lock=true; sndWrong(); say(rnd(OOPS),'🐰');
      setTimeout(()=>{
        [a,b].forEach(x=>{ x.el.classList.remove('up'); put(x.el,''); });
        lock=false;
      }, 900);
    }
  }
  $('#memReset').onclick=()=>{ sndPick(); start(getLvl('mem')); };
  GAMES.mem={key:'mem', start:start};
})();

// ================= MAZE (미로 탈출) =================
(function(){
  // 100 levels: maze grows 4 -> 9 cells a side, carrots to collect 1 -> 6
  const LEVELS=[...Array(100)].map((_,i)=>({
    n:       Math.min(4+Math.floor(i/11), 9),
    carrots: Math.min(1+Math.floor(i/17), 6),
  }));
  const K=(r,c)=>r+','+c;
  const DIRS=[[-1,0],[1,0],[0,-1],[0,1]];
  const board=$('#mzBoard');
  // makeup loot instead of carrots — each spot gets its own item
  const ITEMS=['💄','💅','🪞','🧴','👝','🎀'];
  let wall=[], S=0, rab=[1,1], carrots=new Set(), startCar=[], itemOf=new Map();

  // depth-first carve on an n x n cell grid, rendered as (2n+1)^2 with walls between
  function genMaze(n){
    const w=[...Array(2*n+1)].map(()=>Array(2*n+1).fill(1));
    const seen=[...Array(n)].map(()=>Array(n).fill(false));
    const st=[[0,0]];
    seen[0][0]=true; w[1][1]=0;
    while(st.length){
      const cur=st[st.length-1], r=cur[0], c=cur[1];
      const nb=shuffle([...DIRS]).map(d=>[r+d[0], c+d[1], d[0], d[1]])
        .filter(x=>x[0]>=0&&x[0]<n&&x[1]>=0&&x[1]<n&&!seen[x[0]][x[1]]);
      if(!nb.length){ st.pop(); continue; }
      const nr=nb[0][0], nc=nb[0][1], dr=nb[0][2], dc=nb[0][3];
      seen[nr][nc]=true;
      w[2*r+1+dr][2*c+1+dc]=0;
      w[2*nr+1][2*nc+1]=0;
      st.push([nr,nc]);
    }
    return w;
  }
  // BFS from the rabbit, then scatter carrots among the hardest cells to reach
  function placeCarrots(w, from, want){
    const dist=new Map([[K(from[0],from[1]), 0]]), q=[from];
    for(let i=0;i<q.length;i++){
      const r=q[i][0], c=q[i][1], d=dist.get(K(r,c));
      for(const dd of DIRS){
        const nr=r+dd[0], nc=c+dd[1];
        if(nr<0||nc<0||nr>=w.length||nc>=w.length||w[nr][nc]) continue;
        if(dist.has(K(nr,nc))) continue;
        dist.set(K(nr,nc), d+1); q.push([nr,nc]);
      }
    }
    const far=[...dist.entries()].sort((a,b)=>b[1]-a[1]).map(e=>e[0]);
    // drop only the cells nearest the rabbit, then pick greedily: each carrot goes
    // as far as possible from the ones already placed, so they spread across the maze
    const pool=far.slice(0, Math.max(want, Math.ceil(far.length*.7)));
    const picked=[pool[0]];
    while(picked.length<want && picked.length<pool.length){
      let best=null, bestD=-1;
      for(const k of pool){
        if(picked.indexOf(k)>=0) continue;
        const rc=k.split(',').map(Number);
        let near=Infinity;
        for(const q of picked){
          const pq=q.split(',').map(Number);
          near=Math.min(near, Math.abs(rc[0]-pq[0])+Math.abs(rc[1]-pq[1]));
        }
        if(near>bestD){ bestD=near; best=k; }
      }
      picked.push(best);
    }
    return picked;
  }
  function start(level){
    const cfg=LEVELS[Math.min(level, LEVELS.length-1)];
    wall=genMaze(cfg.n); S=wall.length;
    startCar=placeCarrots(wall, [1,1], cfg.carrots);
    reset();
    say(cfg.carrots>1 ? '메이크업 아이템 '+cfg.carrots+'개를 모두 모아줘! 💄' : '메이크업 아이템까지 길을 찾아가 봐! 💄', '👧');
  }
  function reset(){
    rab=[1,1]; carrots=new Set(startCar);
    itemOf=new Map(startCar.map((k,i)=>[k, ITEMS[i%ITEMS.length]]));
    const zc=Math.min((Math.min(innerWidth,480)-70)/S, 40);
    board.style.setProperty('--zc', zc+'px');
    board.style.gridTemplateColumns='repeat('+S+', auto)';
    render();
  }
  function render(){
    board.innerHTML='';
    for(let r=0;r<S;r++) for(let c=0;c<S;c++){
      const d=document.createElement('div');
      d.className='zcell '+(wall[r][c]?'wall':'floor');
      if(rab[0]===r && rab[1]===c) d.textContent='👧';
      else if(carrots.has(K(r,c))) d.textContent=itemOf.get(K(r,c));
      board.appendChild(d);
    }
  }
  function move(dr,dc){
    const nr=rab[0]+dr, nc=rab[1]+dc;
    if(nr<0||nc<0||nr>=S||nc>=S||wall[nr][nc]) return;
    rab=[nr,nc];
    const k=K(nr,nc);
    if(carrots.has(k)){
      carrots.delete(k); sndRight();
      if(!carrots.size){ render(); setTimeout(win, 300); return; }
      say(rnd(CHEERS),'👧');
    }else sndStep();
    render();
  }
  const pad=$('#mzPad');
  [['',''],['⬆️','-1,0'],['',''],
   ['⬅️','0,-1'],['⬇️','1,0'],['➡️','0,1']].forEach(function(e){
    const t=e[0], dd=e[1];
    if(!t){ const sp=document.createElement('span'); sp.className='blank'; pad.appendChild(sp); return; }
    const b=document.createElement('button');
    b.className='round'; b.textContent=t;
    b.onclick=()=>{ const p=dd.split(',').map(Number); move(p[0],p[1]); };
    pad.appendChild(b);
  });
  let sw=null;
  board.addEventListener('pointerdown',e=>{ sw=[e.clientX,e.clientY]; });
  board.addEventListener('pointerup',e=>{
    if(!sw) return;
    const dx=e.clientX-sw[0], dy=e.clientY-sw[1]; sw=null;
    if(Math.max(Math.abs(dx),Math.abs(dy))<24) return;
    if(Math.abs(dx)>Math.abs(dy)) move(0, dx>0?1:-1);
    else move(dy>0?1:-1, 0);
  });
  document.addEventListener('keydown',e=>{
    if(!$('#g-maze').classList.contains('on')||$('#win').classList.contains('show')) return;
    const m={ArrowUp:[-1,0],ArrowDown:[1,0],ArrowLeft:[0,-1],ArrowRight:[0,1]}[e.key];
    if(m){ e.preventDefault(); move(m[0],m[1]); }
  });
  $('#mzReset').onclick=()=>{ sndPick(); reset(); };  // same maze, back to the start
  GAMES.maze={key:'maze', start:start};
})();

// ================= PATTERN (패턴 이어가기) =================
(function(){
  const POOL=[SPR.m[0],SPR.m[2],SPR.m[12],SPR.k[1],SPR.k[15],
              '🍓','🍊','🍋','🍇','🍉','🐰','🐱','🐶','🦊','⭐','💖','🌸','🎀','🍭'];
  // 100 levels: repeat length 2->6, longer runs, more choices, and from
  // level 46 the blank sits inside the run instead of at the end.
  const LEVELS=[...Array(100)].map((_,i)=>({
    period: Math.min(2+Math.floor(i/20), 6),
    shown:  Math.min(6+Math.floor(i/10), 14),
    opts:   Math.min(3+Math.floor(i/16), 6),
    mid:    i>=45,
    runs:   i>=80 ? 1 : 2,   // full repeats guaranteed before the blank
  }));
  const seqEl=$('#patSeq'), optEl=$('#patOpts');
  let seq=[], hole=0, answer='';

  function start(level){
    const cfg=LEVELS[Math.min(level, LEVELS.length-1)];
    const base=shuffle([...POOL]).slice(0, cfg.period);
    const len=Math.max(cfg.shown+1, cfg.period*cfg.runs+1);
    seq=[...Array(len)].map((_,j)=>base[j%cfg.period]);
    // enough full runs stay visible for the rule to be readable before the blank
    const first=cfg.period*cfg.runs;
    hole = cfg.mid ? first+Math.floor(Math.random()*(len-first)) : len-1;
    answer=seq[hole];
    // distractors come from the pattern itself first - those are the real choice
    const inPat=shuffle(base.filter(x=>x!==answer));
    const outPat=shuffle(POOL.filter(x=>base.indexOf(x)<0));
    const choices=shuffle([answer].concat(inPat.concat(outPat).slice(0, cfg.opts-1)));
    seqEl.style.setProperty('--pc', (len>10?42:52)+'px');
    seqEl.innerHTML='';
    seq.forEach((sym,j)=>{
      const d=document.createElement('div');
      d.className='pcell'+(j===hole?' gap':'');
      put(d, j===hole ? '?' : sym);
      seqEl.appendChild(d);
    });
    optEl.innerHTML='';
    choices.forEach(ch=>{
      const b=document.createElement('button');
      b.className='pal'; put(b, ch);
      b.onclick=()=>pick(b, ch);
      optEl.appendChild(b);
    });
    say('빈칸에 올 것을 골라봐! 🔎','🐰');
  }
  function pick(btn, ch){
    if(ch!==answer){
      btn.classList.add('shake'); sndWrong(); say(rnd(OOPS),'🐰');
      setTimeout(()=>btn.classList.remove('shake'), 400);
      return;
    }
    const cell=seqEl.children[hole];
    cell.classList.remove('gap'); cell.classList.add('pop');
    put(cell, ch);
    sndRight(); say(rnd(CHEERS),'🐰');
    optEl.querySelectorAll('.pal').forEach(b=>{ b.disabled=true; });
    setTimeout(win, 600);
  }
  $('#patReset').onclick=()=>{ sndPick(); start(getLvl('pat')); };
  GAMES.pat={key:'pat', start:start};
})();

// ================= ODD ONE OUT (다른 거 찾기) =================
(function(){
  // tier 0: nothing alike. tier 1: same family. tier 2: hue or shape only.
  // tier 3: the odd one is the SAME emoji, just tilted - font-independent, and
  // the angle keeps shrinking, so difficulty does not run out of emoji pairs.
  const TIERS=[
    [['🐱','🍓'],['🐶','🍋'],['🦊','⭐'],['🐼','🍇'],['🐸','💖'],['🐰','🍉'],
     [SPR.m[0],SPR.k[8]],[SPR.m[12],SPR.c[2]],[SPR.k[3],SPR.m[17]]],
    [['🐱','🐶'],['🐰','🐭'],['🦊','🐶'],['🐻','🐼'],['🍊','🍎'],['🐮','🐷'],
     [SPR.m[0],SPR.m[1]],[SPR.c[0],SPR.c[1]],[SPR.m[3],SPR.m[2]],[SPR.k[9],SPR.k[10]]],
    [['🔵','🟣'],['🟠','🔴'],['🟢','🟩'],['⭐','🌟'],['🍊','🍋'],['💙','💜'],['🟦','🟪']],
  ];
  const TILT=[SPR.m[0],SPR.m[12],SPR.k[15],SPR.c[3],'🐰','🐱','🦊','🍓','⭐','🌸','🐻','🍉'];
  const LEVELS=[...Array(100)].map((_,i)=>({
    n:       Math.min(3+Math.floor(i/14), 8),                 // grid side 3 -> 8
    tier:    i<20 ? 0 : i<45 ? 1 : i<70 ? 2 : 3,
    tilt:    Math.max(8, 24-Math.floor((i-70)/4)*2),          // tier 3 only
    targets: Math.min(1+Math.floor(i/40), 3),                 // odd ones to find
  }));
  const board=$('#oddBoard');
  let need=0, found=0;

  function start(level){
    const cfg=LEVELS[Math.min(level, LEVELS.length-1)];
    const total=cfg.n*cfg.n;
    need=Math.min(cfg.targets, total-1); found=0;
    const tilted=cfg.tier===3;
    const pair=tilted ? null : rnd(TIERS[cfg.tier]);
    const base=tilted ? rnd(TILT) : pair[0];
    const odd=tilted ? base : pair[1];
    const marks=new Set(shuffle([...Array(total).keys()]).slice(0, need));
    const oc=Math.min((Math.min(innerWidth,480)-80)/cfg.n, 76);
    board.style.setProperty('--oc', oc+'px');
    board.style.gridTemplateColumns='repeat('+cfg.n+', auto)';
    board.innerHTML='';
    for(let i=0;i<total;i++){
      const d=document.createElement('div');
      const isOdd=marks.has(i);
      d.className='ocell';
      put(d, isOdd?odd:base);
      if(isOdd && tilted) d.style.transform='rotate('+cfg.tilt+'deg)';
      d.onclick=()=>pick(d, isOdd);
      board.appendChild(d);
    }
    say(need>1 ? '다른 것 '+need+'개를 모두 찾아봐! 🕵️' : '하나만 다른 것을 찾아봐! 🕵️', '🐰');
  }
  function pick(el, isOdd){
    if(el.classList.contains('got')) return;
    if(!isOdd){
      el.classList.add('shake'); sndWrong(); say(rnd(OOPS),'🐰');
      setTimeout(()=>el.classList.remove('shake'), 400);
      return;
    }
    el.classList.add('got','pop'); found++; sndRight();
    setTimeout(()=>el.classList.remove('pop'), 350);
    if(found===need){ setTimeout(win, 400); return; }
    say(rnd(CHEERS),'🐰');
  }
  $('#oddReset').onclick=()=>{ sndPick(); start(getLvl('odd')); };
  GAMES.odd={key:'odd', start:start};
})();
